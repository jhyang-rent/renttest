name: publish

on:
  workflow_dispatch:
    inputs:
      post_id:
        description: "posts/ 아래 게시물 폴더 이름 (예: 20261201-153012)"
        required: true
  schedule:
    - cron: "0 0 * * *"   # 매일 00:00 UTC = 09:00 KST (예약분 발행 · 늦어질 수 있음)

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publish to Instagram
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IMG_BASE: ${{ secrets.IMG_BASE }}
          POST_ID: ${{ inputs.post_id }}
        run: |
          if [ -n "$POST_ID" ]; then
            python publish.py --post "$POST_ID"
          else
            python publish.py --scheduled
          fi

      - name: Save result (posted.txt)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A posts
          if ! git diff --cached --quiet; then
            git commit -m "published: ${POST_ID:-scheduled} $(TZ=Asia/Seoul date +%F_%T)"
            git pull --rebase
            git push
          fi
        env:
          POST_ID: ${{ inputs.post_id }}
